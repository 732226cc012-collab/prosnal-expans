<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Expense Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #000000; color: #23332a; font: 16px Arial, sans-serif; }
    main { max-width: 650px; margin: 20px auto; padding: 24px; background: rgb(255, 255, 255); border-radius: 14px; box-shadow: 0 8px 30px #23332a12; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 22px; color: #68766d; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select, button { width: 100%; padding: 11px; border: 1px solid #000000; border-radius: 7px; font: inherit; }
    button { margin-top: 18px; border: 0; background: #28714a; color: rgb(0, 0, 0); font-weight: bold; cursor: pointer; }
    ul { margin: 0; padding: 0; list-style: none; }
    #empty { padding: 18px 0; color: #68766d; text-align: center; }
  </style>
</head>
<body>
  <img src="D:\7322226233012\profile.png" alt="Expense Tracker" style="width: 60px; margin-top: 60px; border-radius: 10px;">
  <main>        
    <h1>My Expenses</h1>
    <p>Add your spending and see how much you have spent.</p>
    <form id="expense-form">
      <label for="name">What did you buy?</label>
      <input  type="text" placeholder="e.g. Lunch" required>
      <label for="amount">How much? ($)</label>
      <input  type="number" min="0.01" step="0.01" placeholder="0.00" required>
      <label for="category">Category</label>
      <select id="category">
        <option>Food</option><option>Travel</option><option>Bills</option>
        <option>Shopping</option><option>Other</option>
      </select>
      <button type="submit">Add expense</button>
    </form>
    <p>
      <ol>
        <li>food expanses=1000$</li>
        <li>travel expanses=500$</li>
        <li>shopping expanses=200$</li>
      </ol>
    </p>
    <div class="total">Total spent=$1700$</div>
    <h2>Recent expenses</h2>
    <ul id="expense-list"></ul>
    <div id="empty">No expenses yet. Add one above!</div>
    <img src="D:\7322226233012\41310_2025_345_Fig1_HTML.png" alt="Expense Tracker" style="width: 100%; margin-top: 20px; border-radius: 10px;">                                   
    </main>
 
</body>
</html>
